[project]
name = "local-second-brain"
version = "0.1.0"
description = "Review-first, graph-aware Obsidian second brain for Codex and Claude"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "mcp>=1.9,<2",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
  "youtube-transcript-api>=1,<2",
]

[project.scripts]
brain = "second_brain.cli:main"
second-brain-mcp = "second_brain.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
